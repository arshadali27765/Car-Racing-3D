<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Highway Traffic Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #87ceeb; }
        #game-container { width: 100%; height: 100%; position: relative; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-card { background: rgba(0,0,0,0.6); color: white; padding: 8px 16px; border-radius: 8px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); }
        .hud-value { font-size: 20px; font-weight: bold; color: #ffd700; }
        
        #speedometer { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border-radius: 50%; width: 100px; height: 100px; border: 3px solid #ff4500; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #speed-num { font-size: 28px; font-weight: 900; color: #00ffcc; }
        
        /* Controls */
        .controls-container { position: absolute; bottom: 20px; width: calc(100% - 30px); display: flex; justify-content: space-between; pointer-events: auto; }
        .btn-group { display: flex; gap: 10px; }
        .game-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.25); border: 2px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; backdrop-filter: blur(5px); active { background: rgba(255,255,255,0.6); } }
        
        /* Modal screens */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        .modal-content { background: #222; color: white; padding: 25px; border-radius: 12px; text-align: center; max-width: 320px; border: 2px solid #ff4500; }
        .btn-main { background: #ff4500; color: white; border: none; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 15px; cursor: pointer; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- UI -->
        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-card">COINS: <span id="coin-txt" class="hud-value">0</span></div>
                <div class="hud-card">ZONE: <span id="zone-txt" class="hud-value">1 (3 Lanes)</span></div>
                <div class="hud-card">DIST: <span id="dist-txt" class="hud-value">0m</span></div>
            </div>
            
            <div id="speedometer">
                <span id="speed-num">0</span>
                <span style="font-size: 10px;">KM/H</span>
            </div>

            <div class="controls-container">
                <div class="btn-group">
                    <div class="game-btn" id="btn-left">◀</div>
                    <div class="game-btn" id="btn-right">▶</div>
                </div>
                <div class="btn-group">
                    <div class="game-btn" id="btn-brake" style="background: rgba(255,0,0,0.4);">🛑</div>
                    <div class="game-btn" id="btn-gas" style="background: rgba(0,255,0,0.4);">▲</div>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-modal" class="modal">
            <div class="modal-content">
                <h1>HIGHWAY RACER 3D</h1>
                <p style="margin-top: 10px;">Collect Coins & Avoid Traffic!</p>
                <button class="btn-main" id="start-btn">START GAME</button>
            </div>
        </div>

        <!-- Crash/Respawn Modal -->
        <div id="crash-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h1 style="color: #ff4500;">CRASHED!</h1>
                <p id="crash-msg" style="margin: 15px 0;"></p>
                <button class="btn-main" id="respawn-btn">RESPAWN (20 COINS)</button>
                <button class="btn-main" id="restart-btn" style="background: #555;">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator (No external file dependencies needed)
        const AudioSys = {
            ctx: null,
            engineOsc: null,
            engineGain: null,
            isSetup: false,

            init() {
                if (this.isSetup) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Engine Sound
                this.engineOsc = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime);
                this.engineGain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                this.engineOsc.connect(this.engineGain);
                this.engineGain.connect(this.ctx.destination);
                this.engineOsc.start();
                this.isSetup = true;
            },

            updateEngine(speedRatio) {
                if (!this.isSetup) return;
                // Pitch increases with speed
                const freq = 60 + (speedRatio * 180);
                this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);
            },

            playCoin() {
                if (!this.isSetup) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },

            playBrake() {
                if (!this.isSetup) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },

            playCrash() {
                if (!this.isSetup) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        };

        // Basic Game State & Setup
        let scene, camera, renderer;
        let car, speed = 0, coins = 0, distance = 0;
        let keys = { left: false, right: false, gas: false, brake: false };
        let isRunning = false;

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Road Base
            const roadGeo = new THREE.PlaneGeometry(12, 1000);
            const roadMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // Player Car
            const carGeo = new THREE.BoxGeometry(1.6, 0.8, 3.2);
            const carMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc });
            car = new THREE.Mesh(carGeo, carMat);
            car.position.set(0, 0.4, 0);
            scene.add(car);

            // Controls listeners
            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
                el.addEventListener('mousedown', () => { keys[key] = true; });
                el.addEventListener('mouseup', () => { keys[key] = false; });
            };
            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');
            bindBtn('btn-gas', 'gas');
            bindBtn('btn-brake', 'brake');

            document.getElementById('start-btn').onclick = () => {
                AudioSys.init();
                document.getElementById('start-modal').style.display = 'none';
                isRunning = true;
                animate();
            };
        }

        function animate() {
            if (!isRunning) return;
            requestAnimationFrame(animate);

            // Acceleration Logic
            if (keys.gas) {
                speed = Math.min(speed + 0.5, 120);
            } else if (keys.brake) {
                if (speed > 5) AudioSys.playBrake();
                speed = Math.max(speed - 2, 0);
            } else {
                speed = Math.max(speed - 0.2, 0);
            }

            // Steering Logic (Direct: Left = Left, Right = Right)
            if (keys.left && car.position.x > -4.5) {
                car.position.x -= 0.15;
            }
            if (keys.right && car.position.x < 4.5) {
                car.position.x += 0.15;
            }

            // Audio Update
            AudioSys.updateEngine(speed / 120);

            // Score/Distance Updates
            distance += Math.floor(speed * 0.05);
            document.getElementById('speed-num').innerText = Math.floor(speed);
            document.getElementById('dist-txt').innerText = distance + 'm';

            // Camera follow
            camera.position.x = car.position.x * 0.5;
            renderer.render(scene, camera);
        }

        window.onload = initGame;
    </script>
</body>
</html>
