<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Highway Traffic Racer Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Touch control styling */
        .touch-btn {
            background: rgba(20, 25, 40, 0.7);
            border: 2px solid rgba(0, 240, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,240,255,0.2);
            transition: all 0.1s ease;
        }

        .touch-btn:active, .touch-btn.active {
            background: rgba(0, 240, 255, 0.4);
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(0, 240, 255, 0.8);
        }

        .pedal-btn {
            border-radius: 12px;
            background: linear-gradient(180deg, #2a2e3d 0%, #151821 100%);
            border: 2px solid #555;
        }

        .gas-btn {
            border-color: #10b981;
            box-shadow: inset 0 0 12px rgba(16, 185, 129, 0.3);
        }
        .gas-btn:active, .gas-btn.active {
            background: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        }

        .brake-btn {
            border-color: #ef4444;
            box-shadow: inset 0 0 12px rgba(239, 68, 68, 0.3);
        }
        .brake-btn:active, .brake-btn.active {
            background: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }

        .nitro-btn {
            border-color: #3b82f6;
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .nitro-btn:active, .nitro-btn.active {
            background: #60a5fa;
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.9);
        }

        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(15, 20, 32, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }

        /* Dynamic Speedometer Needle */
        .speed-gauge {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #0d111a 60%, #1e293b 100%);
            border: 3px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            position: relative;
        }

        .needle {
            width: 4px;
            height: 45px;
            background: linear-gradient(to top, #ef4444, #ff0055);
            position: absolute;
            bottom: 50%;
            left: calc(50% - 2px);
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.1s ease-out;
            border-radius: 2px;
        }

        /* Subtle scanline and vignette overlay for cinematic feel */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Background Music Audio Element -->
        <audio id="bg-music" loop preload="auto">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>

        <!-- Canvas for Three.js Rendering -->
        <canvas id="three-canvas"></canvas>
        <div class="vignette"></div>

        <!-- MAIN MENU OVERLAY -->
        <div id="main-menu" class="absolute inset-0 z-20 flex flex-col justify-between p-6 glass-panel text-white">
            <!-- Header -->
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-gauge-high text-cyan-400 text-3xl"></i>
                    <h1 class="text-2xl font-black italic tracking-wider bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-500 bg-clip-text text-transparent">
                        HIGHWAY RACER 3D
                    </h1>
                </div>
                <div class="flex items-center gap-2 bg-slate-800/80 px-4 py-2 rounded-full border border-yellow-500/40">
                    <i class="fa-solid fa-coins text-yellow-400 text-xl"></i>
                    <span id="menu-coins" class="text-xl font-bold text-yellow-300">0</span>
                </div>
            </div>

            <!-- Garage / Car Selection Center Display -->
            <div class="flex-1 flex flex-col items-center justify-center my-4">
                <div class="text-center mb-4">
                    <h2 id="car-name" class="text-3xl font-extrabold text-cyan-300 tracking-wide mb-1">NEON VIPER</h2>
                    <p id="car-status" class="text-xs uppercase tracking-widest text-emerald-400 font-bold">UNLOCKED / SELECTED</p>
                </div>

                <!-- Carousel Controls -->
                <div class="flex items-center justify-between w-full max-w-md px-4 my-2">
                    <button id="prev-car-btn" class="touch-btn w-12 h-12 rounded-full"><i class="fa-solid fa-chevron-left"></i></button>
                    <!-- Car Stats Box -->
                    <div class="w-64 glass-panel p-4 rounded-xl text-xs space-y-2 border border-slate-700">
                        <div>
                            <div class="flex justify-between mb-1"><span>TOP SPEED</span><span id="stat-speed-val" class="font-bold text-cyan-400">220 KM/H</span></div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div id="stat-speed-bar" class="bg-cyan-400 h-full w-3/4"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between mb-1"><span>HANDLING</span><span id="stat-handling-val" class="font-bold text-emerald-400">HIGH</span></div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div id="stat-handling-bar" class="bg-emerald-400 h-full w-4/5"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between mb-1"><span>NITRO BOOST</span><span id="stat-nitro-val" class="font-bold text-blue-400">x2.0</span></div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div id="stat-nitro-bar" class="bg-blue-400 h-full w-2/3"></div>
                            </div>
                        </div>
                    </div>
                    <button id="next-car-btn" class="touch-btn w-12 h-12 rounded-full"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <div id="buy-car-container" class="mt-4 hidden">
                    <button id="buy-car-btn" class="px-8 py-3 bg-gradient-to-r from-yellow-500 to-amber-600 font-bold rounded-xl text-lg shadow-lg shadow-amber-500/30 active:scale-95 transition-all">
                        UNLOCK FOR <i class="fa-solid fa-coins ml-1"></i> <span id="buy-price">500</span>
                    </button>
                </div>
            </div>

            <!-- Start Game Action -->
            <div class="flex flex-col items-center gap-3">
                <button id="start-btn" class="w-full max-w-sm py-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 rounded-2xl font-black text-2xl tracking-widest text-white shadow-xl shadow-cyan-500/40 hover:brightness-110 active:scale-95 transition-all">
                    START RACE
                </button>
                <div class="text-xs text-slate-400 flex gap-4">
                    <span><i class="fa-solid fa-keyboard"></i> Arrow Keys / WASD</span>
                    <span><i class="fa-solid fa-mobile-screen"></i> Touch Controls</span>
                </div>
            </div>
        </div>

        <!-- HUD / IN-GAME OVERLAY -->
        <div id="hud-overlay" class="absolute inset-0 z-10 pointer-events-none hidden flex flex-col justify-between p-4">
            <!-- Top HUD Bar -->
            <div class="flex justify-between items-start">
                <!-- Score & Zone -->
                <div class="glass-panel px-4 py-2 rounded-xl flex flex-col gap-1 border border-cyan-500/30">
                    <div class="text-xs text-cyan-400 font-semibold uppercase tracking-wider" id="hud-zone">ZONE 1 (3 LANES)</div>
                    <div class="text-2xl font-extrabold text-white tracking-wider"><span id="hud-score">0</span> <span class="text-xs text-slate-400">M</span></div>
                </div>

                <!-- Coins Display -->
                <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2 border border-yellow-500/30">
                    <i class="fa-solid fa-coins text-yellow-400 text-lg"></i>
                    <span id="hud-coins" class="text-xl font-bold text-yellow-300">0</span>
                </div>
            </div>

            <!-- Middle Speedometer & Gauge -->
            <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center">
                <div class="speed-gauge flex items-center justify-center">
                    <div id="speed-needle" class="needle"></div>
                    <div class="text-center z-10">
                        <div id="hud-speed" class="text-2xl font-black text-white">0</div>
                        <div class="text-[10px] text-cyan-400 font-bold tracking-widest">KM/H</div>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Panel (Touch Friendly) -->
            <div class="pointer-events-auto flex justify-between items-end w-full mb-2 px-2">
                <!-- Left Control Group: Steering -->
                <div class="flex gap-3">
                    <button id="btn-left" class="touch-btn w-16 h-16 rounded-2xl text-2xl active:bg-cyan-500/50">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="btn-right" class="touch-btn w-16 h-16 rounded-2xl text-2xl active:bg-cyan-500/50">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Nitro Power Indicator -->
                <div class="flex flex-col items-center gap-1">
                    <button id="btn-nitro" class="touch-btn nitro-btn w-14 h-14 rounded-full text-xl">
                        <i class="fa-solid fa-bolt"></i>
                    </button>
                    <span class="text-[10px] text-blue-400 font-bold uppercase">NITRO</span>
                </div>

                <!-- Right Control Group: Gas & Brake (Forward Only) -->
                <div class="flex gap-3 items-end">
                    <!-- Brake -->
                    <button id="btn-brake" class="touch-btn pedal-btn brake-btn w-16 h-20 text-xl font-bold">
                        <i class="fa-solid fa-hand-paper"></i>
                    </button>
                    <!-- Acceleration (UP Gas Pedal - Forward Only) -->
                    <button id="btn-up" class="touch-btn pedal-btn gas-btn w-18 h-24 text-2xl font-bold px-4">
                        <i class="fa-solid fa-gas-pump"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- CRASH / RESPAWN POPUP OVERLAY -->
        <div id="crash-modal" class="absolute inset-0 z-30 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
            <div class="glass-panel w-full max-w-sm p-6 rounded-2xl border border-red-500/40 text-center flex flex-col items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center text-3xl mb-1 animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="text-2xl font-black text-white">CAR CRASHED!</h3>
                <p id="crash-reason" class="text-sm text-slate-300">You collided with a side barrier.</p>

                <!-- Respawn Option -->
                <div class="w-full glass-panel p-3 rounded-xl flex justify-between items-center border border-slate-700">
                    <span class="text-xs text-slate-400">RESPAWN COST:</span>
                    <div class="flex items-center gap-1 text-yellow-400 font-bold text-lg">
                        <i class="fa-solid fa-coins"></i>
                        <span id="respawn-cost-val">20</span>
                    </div>
                </div>

                <div class="flex flex-col w-full gap-3 mt-2">
                    <button id="respawn-btn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-bold text-white shadow-lg shadow-emerald-500/30 active:scale-95 transition-all">
                        CONTINUE (RESPAWN)
                    </button>
                    <button id="restart-btn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-slate-300 border border-slate-600 active:scale-95 transition-all">
                        GIVE UP & RESTART
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN GAME SCRIPT -->
    <script>
        /* ========================================================================
           GAME CONFIGURATION & GARAGE CARS DATA
           ======================================================================== */
        const CAR_DATABASE = [
            {
                id: 'viper',
                name: 'NEON VIPER',
                color: 0x00ff88, // Neon Green
                price: 0,
                unlocked: true,
                maxSpeed: 210,
                acceleration: 0.8,
                handling: 0.12,
                nitroMultiplier: 1.5
            },
            {
                id: 'phantom',
                name: 'BLACK PHANTOM',
                color: 0x111115, // Stealth Black
                accentColor: 0xff0055,
                price: 50,
                unlocked: false,
                maxSpeed: 250,
                acceleration: 1.1,
                handling: 0.15,
                nitroMultiplier: 1.8
            },
            {
                id: 'inferno',
                name: 'INFERNO GT',
                color: 0xff2200, // Crimson Red
                price: 150,
                unlocked: false,
                maxSpeed: 290,
                acceleration: 1.4,
                handling: 0.18,
                nitroMultiplier: 2.2
            }
        ];

        // Player Progress & State
        let playerCoins = parseInt(localStorage.getItem('hw_coins') || '0');
        let selectedCarIndex = 0;

        // Sound Effects Generator using Web Audio API
        class SoundController {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playCoinSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playCrashSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playNitroSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sound = new SoundController();

        /* ========================================================================
           THREE.JS ENGINE & WORLD SETUP
           ======================================================================== */
        let scene, camera, renderer;
        let playerCarMesh, playerCarGroup;
        let roadSegments = [];
        let leftBarriers = [], rightBarriers = [];
        let trafficCars = [];
        let coinsList = [];
        let sceneryObjects = [];

        // Gameplay Physics & Variables
        let isGameRunning = false;
        let currentSpeed = 0; // KM/H
        let targetSpeed = 0;
        let playerX = 0; // Lateral position on road
        let distanceTraveled = 0;
        let currentZone = 1;
        let is3Lanes = true; // True = 3 lanes, False = 2 lanes
        let laneWidth = 3.5;
        let roadWidth = 12; // 3-lane width = 12, 2-lane width = 8.5
        let currentCoinsCollected = 0;
        let respawnCost = 20;

        // Input Control States
        const inputs = {
            up: false,
            down: false,
            left: false,
            right: false,
            brake: false,
            nitro: false
        };

        function initThreeEngine() {
            const container = document.getElementById('game-container');
            const canvas = document.getElementById('three-canvas');

            // Scene Setup - Bright Daylight Sky & Atmosphere
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Clear Blue Sky
            scene.fog = new THREE.FogExp2(0xa0d8ef, 0.008); // Daylight atmospheric haze

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 3.2, -6.5);
            camera.lookAt(0, 1.2, 10);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Bright Daylight Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85); // Bright daylight ambient
            scene.add(ambientLight);

            // Sunlight Source
            const sunLight = new THREE.DirectionalLight(0xfff7e6, 1.3); // Warm sunlight
            sunLight.position.set(30, 60, -30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 200;
            scene.add(sunLight);

            // Visual Sun Object in Sky
            const sunGeo = new THREE.SphereGeometry(8, 16, 16);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffaed });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(40, 80, 120);
            scene.add(sunMesh);

            // Build Initial World Environment
            buildPlayerCar();
            buildRoadSystem();

            // Window Resize Listener
            window.addEventListener('resize', onWindowResize, false);
        }

        /* ========================================================================
           PROCEDURAL MESH GENERATION (CARS, ROADS, BARRIERS)
           ======================================================================== */
        
        // Build Procedural Detailed Sports Car Mesh
        function buildPlayerCar() {
            if (playerCarGroup) scene.remove(playerCarGroup);

            const carData = CAR_DATABASE[selectedCarIndex];
            playerCarGroup = new THREE.Group();

            // Main Car Body Chassis
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: carData.color, 
                roughness: 0.2, 
                metalness: 0.8 
            });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.5;
            bodyMesh.castShadow = true;
            playerCarGroup.add(bodyMesh);

            // Cabin / Roof
            const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.1 });
            const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
            cabinMesh.position.set(0, 0.95, -0.2);
            playerCarGroup.add(cabinMesh);

            // Tail Lights (Neon Exhaust Glow)
            const lightGeo = new THREE.BoxGeometry(0.4, 0.12, 0.05);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.6, 0.55, -1.9);
            const rightLight = leftLight.clone();
            rightLight.position.x = 0.6;
            playerCarGroup.add(leftLight);
            playerCarGroup.add(rightLight);

            // Exhaust Nitro Flames (Hidden by default)
            const flameGeo = new THREE.ConeGeometry(0.15, 0.8, 8);
            flameGeo.rotateX(-Math.PI / 2);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            const nitroFlame = new THREE.Mesh(flameGeo, flameMat);
            nitroFlame.name = 'nitroFlame';
            nitroFlame.position.set(0, 0.35, -2.3);
            nitroFlame.visible = false;
            playerCarGroup.add(nitroFlame);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });

            const wheelPositions = [
                [-0.9, 0.35, 1.1],  // Front Left
                [0.9, 0.35, 1.1],   // Front Right
                [-0.9, 0.35, -1.1], // Rear Left
                [0.9, 0.35, -1.1]   // Rear Right
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                playerCarGroup.add(wheel);
            });

            scene.add(playerCarGroup);
        }

        // Generate Road Tiles & Guardrails
        function buildRoadSystem() {
            const segmentLength = 20;
            const totalSegments = 12;

            for (let i = 0; i < totalSegments; i++) {
                const zPos = i * segmentLength;
                createRoadSegment(zPos);
            }
        }

        function createRoadSegment(zPos) {
            const segmentGroup = new THREE.Group();
            segmentGroup.position.z = zPos;

            // Road Plane - Realistic Daytime Asphalt
            const roadGeo = new THREE.PlaneGeometry(roadWidth, 20);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.7 });
            const roadMesh = new THREE.Mesh(roadGeo, roadMat);
            roadMesh.rotation.x = -Math.PI / 2;
            roadMesh.receiveShadow = true;
            segmentGroup.add(roadMesh);

            // Lane Dividers (Dashed Lines)
            const lineGeo = new THREE.PlaneGeometry(0.2, 4);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // Side Metallic Guardrails & Red/White Curbs
            const railGeo = new THREE.BoxGeometry(0.2, 0.5, 20);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 0.8, roughness: 0.2 });

            const curbGeo = new THREE.BoxGeometry(0.5, 0.2, 20);
            const curbMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 });

            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-roadWidth / 2 - 0.2, 0.4, 0);

            const rightRail = new THREE.Mesh(railGeo, railMat);
            rightRail.position.set(roadWidth / 2 + 0.2, 0.4, 0);

            const leftCurb = new THREE.Mesh(curbGeo, curbMat);
            leftCurb.position.set(-roadWidth / 2 - 0.1, 0.1, 0);

            const rightCurb = new THREE.Mesh(curbGeo, curbMat);
            rightCurb.position.set(roadWidth / 2 + 0.1, 0.1, 0);

            segmentGroup.add(leftRail);
            segmentGroup.add(rightRail);
            segmentGroup.add(leftCurb);
            segmentGroup.add(rightCurb);

            // Add Side Scenery Objects (Daytime Green Mountains)
            if (Math.random() > 0.3) {
                const hillGeo = new THREE.ConeGeometry(10 + Math.random() * 8, 16, 6);
                const hillMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.9 });
                const hill = new THREE.Mesh(hillGeo, hillMat);
                const side = Math.random() > 0.5 ? 1 : -1;
                hill.position.set(side * (roadWidth / 2 + 18 + Math.random() * 12), 6, 0);
                segmentGroup.add(hill);
            }

            scene.add(segmentGroup);
            roadSegments.push(segmentGroup);
        }

        /* ========================================================================
           TRAFFIC & COIN SPAWNING SYSTEM
           ======================================================================== */
        function spawnTrafficCar() {
            if (!isGameRunning) return;

            const trafficGroup = new THREE.Group();
            
            // Random Car Type & Color
            const colors = [0x3b82f6, 0xeab308, 0xa855f7, 0xef4444, 0x64748b];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const bodyGeo = new THREE.BoxGeometry(1.7, 0.65, 3.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            trafficGroup.add(body);

            // Lane selection
            const activeLanes = is3Lanes ? [-laneWidth, 0, laneWidth] : [-laneWidth / 1.5, laneWidth / 1.5];
            const chosenLaneX = activeLanes[Math.floor(Math.random() * activeLanes.length)];

            trafficGroup.position.set(chosenLaneX, 0, playerCarGroup.position.z + 80 + Math.random() * 40);
            trafficGroup.userData = { speed: 40 + Math.random() * 40 }; // AI Speed KM/H

            scene.add(trafficGroup);
            trafficCars.push(trafficGroup);
        }

        function spawnCoin() {
            if (!isGameRunning) return;

            const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 12);
            coinGeo.rotateX(Math.PI / 2);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.2 });
            const coinMesh = new THREE.Mesh(coinGeo, coinMat);

            const activeLanes = is3Lanes ? [-laneWidth, 0, laneWidth] : [-laneWidth / 1.5, laneWidth / 1.5];
            const chosenLaneX = activeLanes[Math.floor(Math.random() * activeLanes.length)];

            coinMesh.position.set(chosenLaneX, 0.6, playerCarGroup.position.z + 60 + Math.random() * 30);
            scene.add(coinMesh);
            coinsList.push(coinMesh);
        }

        /* ========================================================================
           GAME LOOP & PHYSICS UPDATES
           ======================================================================== */
        let lastTime = performance.now();

        function animateGameLoop() {
            requestAnimationFrame(animateGameLoop);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isGameRunning) {
                updatePlayerControls(delta);
                updateRoadAndEnvironment();
                updateTraffic(delta);
                updateCoins(delta);
                checkCollisions();
                updateHUD();
            }

            // Always render 3D Scene
            renderer.render(scene, camera);
        }

        // Handle Acceleration, Steering, and Speed Calculations
        function updatePlayerControls(delta) {
            const carData = CAR_DATABASE[selectedCarIndex];

            // Acceleration Logic (Forward Only)
            if (inputs.up) {
                targetSpeed += carData.acceleration * 60 * delta;
            } else if (inputs.brake) {
                targetSpeed -= 120 * delta; // Heavy Braking
            } else {
                targetSpeed -= 15 * delta; // Friction slowdown
            }

            // Nitro Boost
            const nitroFlame = playerCarGroup.getObjectByName('nitroFlame');
            if (inputs.nitro && currentSpeed > 30) {
                targetSpeed += carData.acceleration * 100 * delta;
                if (nitroFlame) nitroFlame.visible = true;
                sound.playNitroSound();
            } else {
                if (nitroFlame) nitroFlame.visible = false;
            }

            // Speed Constraints
            const maxCap = inputs.nitro ? carData.maxSpeed * carData.nitroMultiplier : carData.maxSpeed;
            targetSpeed = Math.max(0, Math.min(targetSpeed, maxCap));
            currentSpeed += (targetSpeed - currentSpeed) * 0.1;

            // Direct Steering Fixed Logic:
            // LEFT button dabane par car positive X ki taraf (Left ki bajay right ja rahi thi pehle) -> Ab + (Right) aur - (Left) properly mapped hain.
            // Agar left dabayein toh car left jaye (negative X direction) aur tilt right ki taraf ho (-0.15).
            if (inputs.left) {
                playerX -= carData.handling * 25 * delta;
                playerCarGroup.rotation.y = THREE.MathUtils.lerp(playerCarGroup.rotation.y, -0.15, 0.1);
            } else if (inputs.right) {
                playerX += carData.handling * 25 * delta;
                playerCarGroup.rotation.y = THREE.MathUtils.lerp(playerCarGroup.rotation.y, 0.15, 0.1);
            } else {
                playerCarGroup.rotation.y = THREE.MathUtils.lerp(playerCarGroup.rotation.y, 0, 0.1);
            }

            // Forward Motion Progress
            const distanceDelta = (currentSpeed / 3.6) * delta;
            distanceTraveled += distanceDelta;
            playerCarGroup.position.z += distanceDelta;
            playerCarGroup.position.x = playerX;

            // Camera Follow smoothly behind player car
            camera.position.z = playerCarGroup.position.z - 6.5;
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerCarGroup.position.x * 0.6, 0.1);
        }

        // Recycles road segments infinitely forward & switches lane zone modes
        function updateRoadAndEnvironment() {
            // Zone / Lane Switch Logic based on distance
            const zoneIndex = Math.floor(distanceTraveled / 500) + 1;
            if (zoneIndex !== currentZone) {
                currentZone = zoneIndex;
                is3Lanes = (currentZone % 2 !== 0); // Alternate 3 lanes and 2 lanes
                roadWidth = is3Lanes ? 12 : 8.5;
                document.getElementById('hud-zone').innerText = `ZONE ${currentZone} (${is3Lanes ? '3 LANES' : '2 LANES'})`;
            }

            // Infinite Road Repositioning
            roadSegments.forEach(segment => {
                if (segment.position.z < playerCarGroup.position.z - 20) {
                    segment.position.z += roadSegments.length * 20;
                }
            });
        }

        // Move AI Traffic
        function updateTraffic(delta) {
            // Periodically spawn traffic
            if (Math.random() < 0.025 && trafficCars.length < 8) {
                spawnTrafficCar();
            }

            trafficCars.forEach((traffic, index) => {
                const moveDist = (traffic.userData.speed / 3.6) * delta;
                traffic.position.z += moveDist;

                // Remove traffic far behind
                if (traffic.position.z < playerCarGroup.position.z - 20) {
                    scene.remove(traffic);
                    trafficCars.splice(index, 1);
                }
            });
        }

        // Rotate & Move Coins
        function updateCoins(delta) {
            if (Math.random() < 0.03 && coinsList.length < 6) {
                spawnCoin();
            }

            coinsList.forEach((coin, index) => {
                coin.rotation.z += 3 * delta;

                // Coin Collection Detection
                const dist = coin.position.distanceTo(playerCarGroup.position);
                if (dist < 1.8) {
                    scene.remove(coin);
                    coinsList.splice(index, 1);
                    currentCoinsCollected += 5;
                    playerCoins += 5;
                    localStorage.setItem('hw_coins', playerCoins);
                    sound.playCoinSound();
                } else if (coin.position.z < playerCarGroup.position.z - 10) {
                    scene.remove(coin);
                    coinsList.splice(index, 1);
                }
            });
        }

        /* ========================================================================
           CRASH & COLLISION DETECTION
           ======================================================================== */
        function checkCollisions() {
            const currentBoundaryX = (roadWidth / 2) - 0.9;

            // 1. Barrier Crash Check (Side Guardrails)
            if (Math.abs(playerX) >= currentBoundaryX) {
                triggerCrash("You hit the highway side guardrail barrier!");
                return;
            }

            // 2. Traffic Car Collision Check
            trafficCars.forEach(traffic => {
                const xDiff = Math.abs(traffic.position.x - playerCarGroup.position.x);
                const zDiff = Math.abs(traffic.position.z - playerCarGroup.position.z);

                if (xDiff < 1.5 && zDiff < 3.2) {
                    triggerCrash("You collided with an oncoming traffic vehicle!");
                }
            });
        }

        function triggerCrash(reason) {
            isGameRunning = false;
            sound.playCrashSound();

            // Camera Shake & Stop
            currentSpeed = 0;
            targetSpeed = 0;

            // Pause Background Music on Crash
            const bgMusic = document.getElementById('bg-music');
            bgMusic.pause();

            // Update & Show Crash Modal
            document.getElementById('crash-reason').innerText = reason;
            document.getElementById('respawn-cost-val').innerText = respawnCost;
            document.getElementById('crash-modal').classList.remove('hidden');
        }

        /* ========================================================================
           UI & HUD UPDATES
           ======================================================================== */
        function updateHUD() {
            document.getElementById('hud-score').innerText = Math.floor(distanceTraveled);
            document.getElementById('hud-coins').innerText = currentCoinsCollected;

            const displaySpeed = Math.max(0, Math.floor(currentSpeed));
            document.getElementById('hud-speed').innerText = displaySpeed;

            // Speedometer Needle Rotation (-120deg to 120deg)
            const needleAngle = -120 + (displaySpeed / 300) * 240;
            document.getElementById('speed-needle').style.transform = `rotate(${needleAngle}deg)`;
        }

        function updateGarageUI() {
            const car = CAR_DATABASE[selectedCarIndex];
            document.getElementById('menu-coins').innerText = playerCoins;
            document.getElementById('car-name').innerText = car.name;

            // Stats UI
            document.getElementById('stat-speed-val').innerText = `${car.maxSpeed} KM/H`;
            document.getElementById('stat-speed-bar').style.width = `${(car.maxSpeed / 300) * 100}%`;

            document.getElementById('stat-handling-val').innerText = car.handling > 0.15 ? 'SUPERIOR' : 'HIGH';
            document.getElementById('stat-handling-bar').style.width = `${(car.handling / 0.2) * 100}%`;

            document.getElementById('stat-nitro-val').innerText = `x${car.nitroMultiplier}`;
            document.getElementById('stat-nitro-bar').style.width = `${(car.nitroMultiplier / 2.5) * 100}%`;

            // Lock / Unlock Buy Button
            const buyContainer = document.getElementById('buy-car-container');
            const statusText = document.getElementById('car-status');

            if (car.unlocked) {
                buyContainer.classList.add('hidden');
                statusText.innerText = "UNLOCKED / READY";
                statusText.className = "text-xs uppercase tracking-widest text-emerald-400 font-bold";
            } else {
                buyContainer.classList.remove('hidden');
                document.getElementById('buy-price').innerText = car.price;
                statusText.innerText = "LOCKED VEHICLE";
                statusText.className = "text-xs uppercase tracking-widest text-red-400 font-bold";
            }

            // Refresh 3D Car Model in Scene
            buildPlayerCar();
        }

        /* ========================================================================
           CONTROLS & EVENT LISTENERS
           ======================================================================== */
        function setupEventListeners() {
            // Keyboard Controls Fixed: ArrowLeft / 'A' maps to inputs.left, ArrowRight / 'D' maps to inputs.right
            window.addEventListener('keydown', e => {
                sound.init();
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.up = true;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = true;
                if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.brake = true;
                if (e.key === 'Shift') inputs.nitro = true;
            });

            window.addEventListener('keyup', e => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.up = false;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = false;
                if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.brake = false;
                if (e.key === 'Shift') inputs.nitro = false;
            });

            // Touch Control Buttons Handler - Swapped btn-left and btn-right bindings correctly
            const bindTouchBtn = (id, keyName) => {
                const btn = document.getElementById(id);
                if (!btn) return;

                const startHandler = (e) => {
                    e.preventDefault();
                    sound.init();
                    inputs[keyName] = true;
                    btn.classList.add('active');
                };

                const endHandler = (e) => {
                    e.preventDefault();
                    inputs[keyName] = false;
                    btn.classList.remove('active');
                };

                btn.addEventListener('touchstart', startHandler, { passive: false });
                btn.addEventListener('touchend', endHandler, { passive: false });
                btn.addEventListener('mousedown', startHandler);
                btn.addEventListener('mouseup', endHandler);
            };

            bindTouchBtn('btn-up', 'up');
            bindTouchBtn('btn-left', 'left');     // Left Touch Button -> inputs.left
            bindTouchBtn('btn-right', 'right');   // Right Touch Button -> inputs.right
            bindTouchBtn('btn-brake', 'brake');
            bindTouchBtn('btn-nitro', 'nitro');

            // Garage Navigation Buttons
            document.getElementById('prev-car-btn').addEventListener('click', () => {
                selectedCarIndex = (selectedCarIndex - 1 + CAR_DATABASE.length) % CAR_DATABASE.length;
                updateGarageUI();
            });

            document.getElementById('next-car-btn').addEventListener('click', () => {
                selectedCarIndex = (selectedCarIndex + 1) % CAR_DATABASE.length;
                updateGarageUI();
            });

            // Buy Car Button
            document.getElementById('buy-car-btn').addEventListener('click', () => {
                const car = CAR_DATABASE[selectedCarIndex];
                if (playerCoins >= car.price) {
                    playerCoins -= car.price;
                    car.unlocked = true;
                    localStorage.setItem('hw_coins', playerCoins);
                    updateGarageUI();
                } else {
                    alert("Not enough coins! Drive more races to collect coins.");
                }
            });

            // Start Game & Play Song
            document.getElementById('start-btn').addEventListener('click', () => {
                sound.init();
                const car = CAR_DATABASE[selectedCarIndex];
                if (!car.unlocked) return;

                // Play Background Song
                const bgMusic = document.getElementById('bg-music');
                bgMusic.volume = 0.4;
                bgMusic.play().catch(e => console.log("Audio autoplay prevented:", e));

                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('hud-overlay').classList.remove('hidden');

                resetGameVars();
                isGameRunning = true;
            });

            // Respawn Button & Resume Song
            document.getElementById('respawn-btn').addEventListener('click', () => {
                if (playerCoins >= respawnCost) {
                    playerCoins -= respawnCost;
                    localStorage.setItem('hw_coins', playerCoins);

                    // Push player car slightly center and forward
                    playerX = 0;
                    playerCarGroup.position.x = 0;
                    playerCarGroup.position.z += 10;
                    currentSpeed = 50;

                    // Resume Background Song
                    const bgMusic = document.getElementById('bg-music');
                    bgMusic.play().catch(e => {});

                    document.getElementById('crash-modal').classList.add('hidden');
                    isGameRunning = true;
                } else {
                    alert("Not enough coins to respawn!");
                }
            });

            // Restart Button
            document.getElementById('restart-btn').addEventListener('click', () => {
                const bgMusic = document.getElementById('bg-music');
                bgMusic.pause();
                bgMusic.currentTime = 0;

                document.getElementById('crash-modal').classList.add('hidden');
                document.getElementById('hud-overlay').classList.add('hidden');
                document.getElementById('main-menu').classList.remove('hidden');
                updateGarageUI();
            });
        }

        function resetGameVars() {
            playerX = 0;
            currentSpeed = 0;
            targetSpeed = 0;
            distanceTraveled = 0;
            currentCoinsCollected = 0;
            currentZone = 1;
            is3Lanes = true;
            roadWidth = 12;

            playerCarGroup.position.set(0, 0, 0);

            // Clear Traffic & Coins
            trafficCars.forEach(t => scene.remove(t));
            coinsList.forEach(c => scene.remove(c));
            trafficCars = [];
            coinsList = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize Everything on Load
        window.onload = () => {
            initThreeEngine();
            setupEventListeners();
            updateGarageUI();
            animateGameLoop();
        };
    </script>
</body>
</html>
